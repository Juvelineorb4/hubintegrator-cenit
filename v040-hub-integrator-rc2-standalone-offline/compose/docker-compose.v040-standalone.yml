name: hubv040

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_HOST_PORT}:5432"
    volumes:
      - hubv040_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_HOST_PORT}:6379"
    volumes:
      - hubv040_redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 12

  db-init:
    image: postgres:16-alpine
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./migrations:/migrations:ro
    command:
      - /bin/sh
      - -lc
      - |
        set -euo pipefail
        psql -h postgres -U "${POSTGRES_USER}" -d "${POSTGRES_DB}" -v ON_ERROR_STOP=0 -f /migrations/0000_tan_power_pack.sql
        psql -h postgres -U "${POSTGRES_USER}" -d "${POSTGRES_DB}" -v ON_ERROR_STOP=0 -f /migrations/0001_red_hawkeye.sql
        psql -h postgres -U "${POSTGRES_USER}" -d "${POSTGRES_DB}" -v ON_ERROR_STOP=1 -f /migrations/verify-phd-schema.sql

  app-backend:
    image: v040-app-backend:rc2
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      PHD_METADATA_MODE: ${PHD_METADATA_MODE}
      PHD_METADATA_CONCURRENCY: ${PHD_METADATA_CONCURRENCY}
      PHD_METADATA_MAX_TAGS: ${PHD_METADATA_MAX_TAGS}
      ODBC_API_URL: ${ODBC_API_URL}
      ODBC_CONNECT_TIMEOUT_SECONDS: ${ODBC_CONNECT_TIMEOUT_SECONDS}
      ODBC_READ_TIMEOUT_SECONDS: ${ODBC_READ_TIMEOUT_SECONDS}
    ports:
      - "${BACKEND_HOST_PORT}:3000"
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null 2>&1 || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 12

  python-app:
    image: v040-python-app:rc2
    restart: unless-stopped
    depends_on:
      app-backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: 8000
      BACKEND_URL: http://app-backend:3000/api
      ODBC_API_URL: ${ODBC_API_URL}
      ODBC_CONNECT_TIMEOUT_SECONDS: ${ODBC_CONNECT_TIMEOUT_SECONDS}
      ODBC_READ_TIMEOUT_SECONDS: ${ODBC_READ_TIMEOUT_SECONDS}
      REDIS_URL: redis://redis:6379/0
      REDIS_CACHE_TTL: ${REDIS_CACHE_TTL}
    ports:
      - "${PYTHON_HOST_PORT}:8000"
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://127.0.0.1:8000/ >/dev/null 2>&1 || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 12

volumes:
  hubv040_postgres_data:
    name: hubv040_postgres_data
  hubv040_redis_data:
    name: hubv040_redis_data
